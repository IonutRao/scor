<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scorul zilei</title>
<meta name="description" content="Ține scorul zilei tale: faptele bune pe plus, cele mai puțin bune pe minus.">
<meta name="theme-color" content="#F5F5FA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one phone-width column. A dark score card leads each screen, plain lists follow, a fixed tab bar closes it. */
:root {
  --bg: #F5F5FA;
  --card: #FFFFFF;
  --ink: #1E1B4B;
  --on-ink: #FFFFFF;
  --muted: #5B5C7A;
  --line: #E3E3EE;
  --control: #E9E9F3;
  --control-ink: #45466A;
  --field: #8E8FB0;
  --hero: #1E1B4B;
  --hero-ink: #FFFFFF;
  --hero-muted: #C8C9E8;
  --hero-zero: #55528F;
  --plus: #3DDC97;
  --plus-tint: #D9F8EA;
  --plus-text: #0A6E46;
  --minus: #FF6F59;
  --minus-tint: #FFE4DE;
  --minus-text: #B5301A;
  --gold: #FFC53D;
  --scrim: rgba(30, 27, 75, .5);
  --font-display: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --nav-h: 64px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.35 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; -webkit-tap-highlight-color: transparent; }
h1, h2, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
h1:focus { outline: none; }

.app { max-width: 30rem; margin-inline: auto; padding-inline: 16px; padding-block: 20px calc(var(--nav-h) + 28px); }
.app.is-add { padding-block: 20px 24px; }

/* Header */
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-inline: 8px; min-height: 44px; }
.head h1 { font: 700 22px/1.3 var(--font-display); text-wrap: balance; }
.head-sub { font-size: 14px; color: var(--muted); text-align: right; }
.head-add { align-items: center; }
.icon-btn { flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--ink); }
.head-add .icon-btn { margin-right: -10px; }
/* The "who" button of the educator mode sits at the right end of every header; with it, the subtitle wraps under the title */
.head-end { flex: none; display: flex; align-items: center; gap: 6px; }
.head.has-who { flex-wrap: wrap; align-items: center; }
.head.has-who .head-sub { flex-basis: 100%; text-align: left; margin-top: -4px; }
.who { min-height: 34px; padding: 0 8px 0 12px; border-radius: 17px; display: inline-flex; align-items: center; gap: 2px; background: var(--control); color: var(--ink); font-size: 13px; font-weight: 700; max-width: 46vw; }
.who > svg { flex: none; }
.who.kid { background: var(--ink); color: var(--on-ink); }
.for-kid { margin: -6px 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
.sub-h { margin-top: 14px; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

/* Example data notice */
.demo { margin-top: 8px; padding: 4px 6px 4px 16px; border-radius: 16px; background: var(--gold); color: var(--ink); display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.demo button { flex: none; min-height: 44px; padding: 0 12px; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

/* Score card */
.hero { margin-top: 12px; padding: 20px 24px 22px; border-radius: 28px; background: var(--hero); color: var(--hero-ink); }
.hero-num { font: 800 clamp(72px, 25vw, 96px)/1 var(--font-display); letter-spacing: -3px; font-variant-numeric: tabular-nums; }
.hero-num.sm { font-size: 56px; letter-spacing: -2px; }
.hero-num.pos { color: var(--plus); }
.hero-num.neg { color: var(--minus); }
.hero-label { margin-top: 2px; font-size: 15px; font-weight: 600; color: var(--hero-muted); }
.hero-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.hero-streak { font-size: 14px; font-weight: 700; color: var(--hero-muted); }
.hero-streak.on { color: var(--gold); }
.hero-streak svg { vertical-align: -2px; margin-right: 5px; fill: currentColor; }
.hero-line { margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--hero-muted); }
.hero-line b { color: var(--hero-ink); font-weight: 700; }

/* Seven-day chart */
.chart { margin-top: 20px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 146px; }
.col { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.col-v { font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.col-v.neg { color: var(--minus); }
.col-v.zero { color: var(--hero-muted); }
.bar { width: 100%; border-radius: 7px; }
.bar.pos { background: var(--plus); }
.bar.neg { background: var(--minus); }
.bar.zero { background: var(--hero-zero); }
.days { margin-top: 8px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; font-size: 12px; color: var(--hero-muted); text-align: center; }
.days .is-today { font-weight: 800; color: var(--hero-ink); }

/* Three small figures */
.stats { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { min-width: 0; padding: 12px; border-radius: 18px; background: var(--card); }
.stat-num { display: flex; align-items: center; gap: 6px; font: 700 clamp(17px, 5.2vw, 20px)/1.35 var(--font-display); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat-num.pos { color: var(--plus-text); }
.stat-num.neg { color: var(--minus-text); }
.stat-num svg { flex: none; }
.ic-flame { fill: var(--gold); stroke: var(--ink); }
.stat-label { margin-top: 2px; font-size: 12px; color: var(--muted); }
@media (max-width: 359px) { .stat-num svg { display: none; } }

/* The two main actions */
.cta { margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.btn { min-height: 60px; padding: 8px 10px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; text-decoration: none; text-align: center; }
.btn-sign { font-size: 26px; font-weight: 500; line-height: 1; }
.btn-plus { background: var(--plus); color: var(--ink); }
.btn-minus { background: var(--minus-tint); color: var(--minus-text); }
.btn:active, .save:active, .chip:active { transform: scale(.98); }

/* Sections and lists */
.sect { margin-top: 22px; padding-inline: 8px; }
.pad { padding-inline: 8px; }
.pad .sect { padding-inline: 0; }
.sect > h2, .field label { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.sect > h2 { margin-bottom: 4px; }
.rows > li { border-bottom: 1px solid var(--line); }
.rows > li:last-child { border-bottom: 0; }
.row { width: 100%; min-height: 58px; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; }
button.row:active { opacity: .6; }
.row-main { min-width: 0; display: flex; flex-direction: column; }
.row-t { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.row-s { font-size: 12px; color: var(--muted); }
.row-end { flex: none; display: flex; align-items: center; gap: 4px; }
.row-end .icon-btn { margin-right: -12px; color: var(--muted); }
.pill { flex: none; padding: 5px 11px; border-radius: 999px; background: var(--control); color: var(--control-ink); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill.plus { background: var(--plus-tint); color: var(--plus-text); }
.pill.minus { background: var(--minus-tint); color: var(--minus-text); }
.sub { margin-bottom: 10px; padding: 2px 14px; border-radius: 16px; background: var(--card); }
.sub > li { border-bottom: 1px solid var(--line); }
.sub > li:last-child { border-bottom: 0; }
.sub .row { min-height: 52px; }
.sub .row-t { font-size: 15px; }
.empty { padding: 14px 0 8px; }
.empty-t { font-size: 16px; font-weight: 600; }
.empty-s { font-size: 14px; color: var(--muted); }
.note { max-width: 34em; font-size: 14px; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* The hidden field a photo is chosen through: pinned to the corner of the window, so it takes no room and never moves the page */
.sr.pin { position: fixed; top: 0; left: 0; margin: 0; opacity: 0; pointer-events: none; }

/* Details of an activity: a small mark in lists, the text itself only where it was asked for */
.note-ic { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 20px; margin-left: 2px; border-radius: 10px; background: var(--control); color: var(--control-ink); vertical-align: -3px; }
.note-of { margin-top: 10px; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.note-of + .field { margin-top: 14px; }
.note-of b { font-weight: 700; color: var(--ink); }
.hint-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

/* A photo: its box has the photo's shape from the start, so nothing jumps when the picture arrives.
   --shot-max is the tallest it may get; a taller photo gets a narrower box of the same shape (max-width is set inline). */
.shot { --shot-max: 70vh; width: 100%; max-height: var(--shot-max); margin-left: auto; margin-right: auto; border-radius: 14px; overflow: hidden; background: var(--control); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.shot img { display: block; width: 100%; height: 100%; object-fit: contain; }
.shot-msg { padding: 0 12px; font-size: 13px; color: var(--control-ink); text-align: center; }
.shot.thumb { --shot-max: 140px; flex: none; width: 104px; margin: 0; border-radius: 12px; }
.shot.thumb .shot-msg { font-size: 11px; padding: 0 6px; }
.pic { margin-top: 22px; display: flex; align-items: center; gap: 14px; }
.pic-acts { min-width: 0; flex: none; display: flex; flex-direction: column; align-items: flex-start; }
.pic-acts .link { min-height: 40px; }
.count { flex: none; margin-left: auto; font-variant-numeric: tabular-nums; }

/* Two-way switches */
.seg { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: var(--control); }
.sect .seg { margin-top: 8px; }
.seg-b { min-height: 44px; padding: 6px 8px; border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--control-ink); }
.seg-b[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 700; }
.seg-b.plus[aria-pressed="true"] { background: var(--plus); color: var(--ink); }
.seg-b.minus[aria-pressed="true"] { background: var(--minus); color: var(--ink); }

/* Favorites */
.chips { margin-top: 6px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chip { min-width: 0; min-height: 52px; padding: 6px 14px; border-radius: 16px; background: var(--card); display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; text-align: left; }
.chip-n { min-width: 0; line-height: 1.2; overflow-wrap: anywhere; }
.chip-p { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }
.chips.plus .chip-p { color: var(--plus-text); }
.chips.minus .chip-p { color: var(--minus-text); }
.chips.plus .chip[aria-pressed="true"] { background: var(--plus); font-weight: 700; }
.chips.minus .chip[aria-pressed="true"] { background: var(--minus); font-weight: 700; }
.chips .chip[aria-pressed="true"] .chip-p { color: var(--ink); font-weight: 800; }
@media (max-width: 359px) { .chip { padding-inline: 10px; font-size: 14px; } }

/* New activity form */
.field { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; }
.field input { width: 100%; height: 52px; padding: 0 14px; border: 1.5px solid var(--field); border-radius: 16px; background: var(--card); font-size: 16px; }
.field input::placeholder { color: var(--muted); opacity: 1; }
.field input:focus-visible, .field textarea:focus-visible { outline-offset: 0; }
.field textarea { display: block; width: 100%; min-height: 92px; padding: 13px 14px; border: 1.5px solid var(--field); border-radius: 16px; background: var(--card); font-size: 16px; line-height: 1.4; resize: none; overflow: hidden; }
.field textarea::placeholder { color: var(--muted); opacity: 1; }
.err { font-size: 14px; font-weight: 600; color: var(--minus-text); }
.line { margin-top: 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.line-t { font-size: 16px; font-weight: 600; }
.line-s { font-size: 12px; color: var(--muted); }
.stepper { flex: none; display: flex; align-items: center; gap: 10px; }
.round { width: 44px; height: 44px; border-radius: 50%; background: var(--card); font-size: 22px; line-height: 1; }
.step-val { min-width: 48px; text-align: center; font: 800 28px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.check { margin-top: 18px; min-height: 44px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
.check input { flex: none; width: 22px; height: 22px; margin: 0; accent-color: var(--plus-text); }
.save-wrap { position: sticky; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin-top: 28px; }
/* With the details field open the bar stays at the end of the form, so it never covers the line being written. It is not
   tied to focus: a bar that jumps back to sticky the moment the field loses focus would land under the finger that just
   tapped a button above it, and could even press Save. */
.save-wrap.flat { position: static; }
.save { width: 100%; min-height: 60px; border-radius: 18px; background: var(--plus); color: var(--ink); font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.save.minus { background: var(--minus); }

/* Profile */
.btn-line { margin-top: 12px; min-height: 48px; padding: 8px 18px; border-radius: 16px; border: 1.5px solid var(--minus-text); color: var(--minus-text); font-size: 15px; font-weight: 700; }

/* Tab bar */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--card); border-top: 1px solid var(--line); }
.nav-in { max-width: 30rem; height: var(--nav-h); margin-inline: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.nav a { display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none; }
.nav a span { position: relative; padding: 8px 16px; border-radius: 999px; }
.nav-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--minus); box-shadow: 0 0 0 2px var(--card); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 800; }
.nav a[aria-current="page"] span { background: var(--plus-tint); }

/* Short confirmation message */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 10; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--on-ink); font-size: 14px; font-weight: 700; text-align: center; }

/* Confirmation dialog */
.dlg { width: min(22rem, calc(100% - 32px)); padding: 0; border: 0; border-radius: 24px; background: var(--card); color: var(--ink); }
.dlg::backdrop { background: rgba(30, 27, 75, .5); background: var(--scrim, rgba(30, 27, 75, .5)); }
.dlg-in { padding: 24px; }
.dlg h2 { font: 700 18px/1.3 var(--font-display); overflow-wrap: anywhere; }
.dlg p { margin-top: 6px; font-size: 14px; color: var(--muted); }
.dlg .dlg-note { margin-top: 14px; padding: 10px 14px; border-radius: 14px; background: var(--bg); white-space: pre-line; overflow-wrap: anywhere; font-size: 15px; line-height: 1.45; color: var(--ink); }
.dlg-shot { margin-top: 12px; }
.dlg-list { margin-top: 10px; }
.dlg-list .row { width: 100%; min-height: 48px; }
.dlg-list .row[aria-pressed="true"] .row-t { font-weight: 700; }
.dlg-list .pill { min-width: 44px; text-align: center; }
.who-on { color: var(--plus-text); font-weight: 800; }
.who-streak { display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; }
.who-streak svg { fill: var(--gold); }
.dlg-list .dlg-link { margin: 6px 0 -6px -6px; }

/* The in-app camera: the live picture fills the screen, the shutter sits at the bottom */
.cam { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: #000; color: #fff; }
.cam[hidden] { display: none; }
.cam-view { flex: 1; min-height: 0; width: 100%; object-fit: cover; background: #000; }
.cam-view.mirror { transform: scaleX(-1); }
.cam-msg { position: absolute; left: 24px; right: 24px; top: 38%; font-size: 16px; line-height: 1.45; text-align: center; color: #fff; }
.cam-top { position: absolute; top: 0; right: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; }
.cam-bar { flex: none; position: relative; display: flex; align-items: center; justify-content: center; gap: 28px; padding: 20px 16px calc(24px + env(safe-area-inset-bottom, 0px)); background: #000; }
.cam-btn { width: 48px; height: 48px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, .16); color: #fff; }
.cam-shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: rgba(255, 255, 255, .28); box-shadow: inset 0 0 0 4px #000; }
.cam-shutter:active { background: #fff; }
.cam-shutter:disabled { opacity: .35; }
.cam-native { position: absolute; left: 16px; right: 16px; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); min-height: 44px; padding: 0 16px; border-radius: 22px; background: #fff; color: #000; font-size: 15px; font-weight: 700; }
.cam-native[hidden] { display: none; }
html.cam-open, html.cam-open body { overflow: hidden; }
.dlg-shot .shot { --shot-max: 46vh; }
.dlg-link { margin: 4px 0 -8px -6px; }
.dlg-actions { margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.dlg-actions button { min-height: 48px; padding: 6px 10px; border-radius: 14px; font-size: 15px; font-weight: 700; }
.dlg-cancel { background: var(--control); }
.dlg-ok { background: var(--minus); }

@media (prefers-reduced-motion: reduce) { .btn:active, .save:active, .chip:active { transform: none; } }

/* Accounts, visibility and the public feed. Loaded after app.css and built on the same tokens. */

/* Small text helpers */
.hint { font-size: 12px; color: var(--muted); }
.info { font-size: 14px; font-weight: 600; color: var(--plus-text); }
.err-detail { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.link { min-height: 44px; padding: 0 6px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 700; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.msgs { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.go { margin-top: 16px; }

/* The save button of the new-activity form stays reachable; a strip of page colour keeps the form from showing through around it. */
.app.is-add { padding-block: 20px 8px; }
.save-wrap { bottom: 0; margin-top: 16px; padding: 12px 0 calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--bg) 12px); }
.center { margin-top: 12px; display: flex; justify-content: center; }
.note.top { margin-top: 18px; }
.notice { margin-top: 8px; padding: 10px 16px; border-radius: 16px; background: var(--control); color: var(--control-ink); font-size: 13px; font-weight: 600; }
.ic-star { fill: var(--gold); stroke: var(--ink); }

/* Sign-in screen */
.brand { margin-top: 12px; padding: 24px; border-radius: 28px; background: var(--hero); color: var(--hero-ink); }
.brand-t { font: 800 32px/1.12 var(--font-display); letter-spacing: -1px; text-wrap: balance; color: var(--plus); }
.brand-s { margin-top: 10px; font-size: 15px; font-weight: 600; color: var(--hero-muted); }
.langs { flex: none; display: flex; gap: 2px; }
.langs button { min-width: 44px; min-height: 44px; font-size: 14px; font-weight: 600; color: var(--muted); }
.langs button[aria-pressed="true"] { font-weight: 800; color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.save:disabled { opacity: .6; cursor: default; }

/* Compact two-way switch: visibility, feed language */
.seg.small { margin-top: 0; flex: none; }
.seg.small .seg-b { padding: 6px 10px; font-size: 14px; }

/* Four tabs once the feed exists */
.nav-in { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }

.kv-v { min-width: 0; font-size: 16px; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.kv-end { min-width: 0; display: flex; align-items: center; gap: 8px; }
.btn-line.calm { border-color: var(--ink); color: var(--ink); }
.btns { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 0 10px; }

/* Encouragements received */
.gold { margin-top: 12px; padding: 16px 20px; border-radius: 24px; background: var(--gold); color: var(--ink); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.gold-t { font-size: 15px; font-weight: 700; }
.gold-s { font-size: 12px; font-weight: 500; }
.gold-n { flex: none; display: flex; align-items: center; gap: 6px; font: 800 28px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.gold-n svg { fill: currentColor; }

/* The shared goal "On plus today": one compact card, a count and the first names of those on plus */
.pulse { margin-top: 12px; padding: 16px 20px; border-radius: 24px; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.pulse-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pulse-t { font-size: 15px; font-weight: 700; }
.pulse-n { flex: none; font: 800 28px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--plus-text); }
.pulse-n.zero { color: var(--muted); }
.pulse-s { margin-top: 6px; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.pulse-s b { font-weight: 700; color: var(--ink); }
.pulse-acts { margin-top: 8px; display: flex; align-items: center; gap: 12px; }
.pulse-join { min-height: 40px; padding: 0 18px; border-radius: 20px; background: var(--ink); color: var(--on-ink); font-size: 14px; font-weight: 700; }
.pulse-join:disabled { opacity: .6; }
.pulse-acts .link { min-height: 40px; }

.feed-bar { margin-top: 14px; padding-inline: 8px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 8px; }
.feed-bar .link { margin-left: auto; }
.feed { padding-inline: 8px; }
.post { padding: 16px 0; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.post:last-child { border-bottom: 0; }
.post-top, .post-bot { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.post-who { min-width: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.post-who b { font-weight: 700; color: var(--ink); }
.post-t { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.post-more { display: block; width: 100%; text-align: left; }
.post-more:active { opacity: .6; }
.post-more[aria-expanded="true"] .note-ic { background: var(--ink); color: var(--on-ink); }
.note-ic + .note-ic, .post-more .note-ic + .note-ic { margin-left: 4px; }
.post-note { padding: 10px 14px; border-radius: 14px; background: var(--card); white-space: pre-line; overflow-wrap: anywhere; font-size: 15px; line-height: 1.45; }
.post-n { min-width: 0; font-size: 13px; color: var(--muted); }
.cheer { flex: none; min-height: 44px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 22px; background: var(--card); color: var(--ink); font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.cheer svg { fill: none; stroke: currentColor; }
.cheer[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); }
.cheer[aria-pressed="true"] svg { fill: currentColor; }
.cheer:active { transform: scale(.98); }
@media (prefers-reduced-motion: reduce) { .cheer:active { transform: none; } }

      ? { day: pz.day, on: !!pz.on, total: pz.total > 0 ? pz.total : 0, up: names(pz.up), others: names(pz.others), you: typeof pz.you === 'boolean' ? pz.you : null, at: pz.at > 0 ? pz.at : 0 }

    d.entries = d.entries.filter(function (e) { return okItem(e) && /^\d{4}-\d{2}-\d{2}$/.test(e.day) && typeof e.id === 'string'; });
    d.entries.forEach(function (e) {
      if (!UUID.test(e.id)) { e.id = uuid(); e.sync = 1; }
      if (e.sync !== 0) e.sync = 1;
      e.pub = !!e.pub;

      if (note) e.note = note; else delete e.note;

  /* Lista copiilor, curatata: id-uri de forma asteptata si nume scurte. */
  function cleanEdu(edu) {
    var out = { on: !!(edu && edu.on), list: [] }, seen = {};
    (edu && Array.isArray(edu.list) ? edu.list : []).forEach(function (k) {
      if (!k || typeof k.id !== 'string' || !UUID.test(k.id) || typeof k.name !== 'string' || seen[k.id]) return;

  function findKid(id, edu) {
    var list = (edu || data.edu).list;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;

  /* O saptamana de exemple, doar pentru previzualizare. */
  function seedDemo(d) {
    var now = new Date(), today = L.dayKey(now), start = L.parseDay(today).getTime();
    var plan = [
      [['gym', 'plus', 10], ['read', 'plus', 10], ['walk', 'plus', 10], ['anger', 'minus', 5], ['meditate', 'plus', 5]],
      [['gym', 'plus', 10], ['read', 'plus', 10], ['meditate', 'plus', 5]],
      [['gym', 'plus', 10], ['walk', 'plus', 10], ['sleep', 'plus', 10], ['water', 'plus', 5], ['sweets', 'minus', 5]],
      [['read', 'plus', 10], ['walk', 'plus', 10], ['late', 'minus', 5]],
      [['gym', 'plus', 10], ['read', 'plus', 10], ['sleep', 'plus', 10]],
      [['walk', 'plus', 10], ['meditate', 'plus', 5], ['water', 'plus', 5]],
      [['water', 'plus', 5], ['delay', 'minus', 5]]
    ];
    plan.forEach(function (list, daysAgo) {
      var day = L.addDays(today, -daysAgo), base = L.parseDay(day).getTime();
      list.forEach(function (a, i) {
        /* Azi: ore intre 7 dimineata si acum, ca exemplele sa nu apara in viitor sau in toiul noptii. */
        var from = now.getTime() - (start + 7 * 3600000) > 1800000 ? start + 7 * 3600000 : start;
        var ts = daysAgo === 0
          ? from + Math.round((i + 1) * (now.getTime() - from) / (list.length + 1))
          : base + (8 + i * 3) * 3600000;
        d.entries.push({ id: uuid(), ts: ts, day: day, type: a[1], pts: a[2], key: a[0], pub: false, cheers: 0, sync: 1 });
      });

  function initData() {
    var d = load();
    if (usable(d)) { data = upgrade(d); return; }

  function pickLang() {
    if (data.lang === 'ro' || data.lang === 'en') return data.lang;
    if (CFG.lang === 'ro' || CFG.lang === 'en') return CFG.lang;
    var n = '';
    try { n = (navigator.language || '').toLowerCase(); } catch (e) { /* ramane engleza */ }
    return n.indexOf('ro') === 0 ? 'ro' : 'en';
  }

  function findFav(id) { for (var i = 0; i < data.favs.length; i++) if (data.favs[i].id === id) return data.favs[i]; return null; }
  function findEntry(id) { for (var i = 0; i < data.entries.length; i++) if (data.entries[i].id === id) return data.entries[i]; return null; }
  function myCheers() { return data.entries.reduce(function (s, e) { return s + (e.kid ? 0 : e.cheers || 0); }, 0); }
  /* Detaliile se pot scrie pe dispozitiv oricand; cu cont, doar daca baza de date a fost adusa la versiunea care le pastreaza. */
  function notesOn() { return !BACKEND || data.sv >= NOTES_FROM; }
  /* Pozele stau in cont, deci exista doar cu cont si cu baza de date adusa la versiunea care le cunoaste. */
  function photosOn() { return BACKEND && data.sv >= PHOTOS_FROM; }
  /* Telul comun "Azi pe plus" cere si el baza de date adusa la versiunea care il cunoaste. */
  function pulseOn() { return BACKEND && data.sv >= PULSE_FROM; }
  /* Modul educator se poate porni fara cont oricand; cu cont, doar daca baza de date stie de copii. */
  function eduAvail() { return !BACKEND || data.sv >= EDU_FROM; }
  function eduOn() { return eduAvail() && data.edu.on; }
  /* Copilul ales acum, sau null pentru adult. O alegere ramasa fara copil (sters, mod oprit) inseamna adultul. */
  function whoNow() { return eduOn() && data.who && findKid(data.who) ? data.who : null; }
  function whoName() { var k = whoNow() ? findKid(whoNow()) : null; return k ? k.name : tr('me'); }
  /* Activitatile celui ales: ale adultului, sau ale copilului ales. */
  function scope() {
    var who = whoNow();
    return data.entries.filter(function (e) { return (e.kid || null) === who; });
  }
  function isKidEntry(e) { return !!e.kid; }

  /* ---------- salvarea in cont ---------- */

  function pendingCount() {
    var n = data.outbox.del.length + data.outbox.vis.length + data.outbox.note.length + data.outbox.photo.length +
      (data.favsRev !== data.favsSynced ? 1 : 0);
    for (var i = 0; i < data.entries.length; i++) if (data.entries[i].sync === 1) n++;
    return n;
  }

  /* Schimbarile de poze care pot pleca acum spre cont: fisierul a ajuns deja acolo, iar activitatea este cunoscuta de cont
     sau pleaca in acelasi drum (ids). Fara ids: cele care pot pleca acum sau odata cu activitatea lor. */
  function photoOps(ids) {
    return data.outbox.photo.filter(function (op) {
      var e = findEntry(op.id);
      if (!e || (op.photo && data.uploads.indexOf(op.photo) >= 0)) return false;
      return e.sync !== 1 || !ids || !!ids[e.id];
    });
  }

  /* Mai este ceva care poate pleca chiar acum? O poza al carei fisier inca nu a ajuns in cont asteapta incarcarea,
     nu un drum nou pana la server. */
  function canSend() {
    if (data.outbox.del.length || data.outbox.vis.length || data.outbox.note.length || data.favsRev !== data.favsSynced) return true;
    if (data.eduRev !== data.eduSynced && data.sv >= EDU_FROM) return true;
    for (var i = 0; i < data.entries.length; i++) if (data.entries[i].sync === 1 && canTravel(data.entries[i])) return true;
    return photoOps(null).length > 0;
  }

  function queueSync(delay) {
    if (!BACKEND || auth !== 'in') return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(sync, delay == null ? 700 : delay);
  }

  /* Un singur drum pana la server: trimite ce s-a schimbat aici si primeste inapoi starea contului. */
  function sync() {
    if (!BACKEND || auth !== 'in') return;
    if (syncing) { syncAgain = true; return; }
    clearTimeout(syncTimer);
    /* Un raspuns care soseste dupa iesirea din cont, sau dupa intrarea in altul, nu mai are ce schimba aici. */
    var uid = data.uid, mine = session;
    function late() { return mine !== session || data.uid !== uid; }
    var batch = data.entries.filter(function (e) { return e.sync === 1 && canTravel(e); }).slice(0, 300);
    var sent = {
      ids: {}, del: data.outbox.del.slice(), vis: data.outbox.vis.slice(), note: data.outbox.note.slice(), photo: [],
      rev: data.favsRev, favs: data.favsRev !== data.favsSynced,
      eduRev: data.eduRev, edu: data.eduRev !== data.eduSynced && data.sv >= EDU_FROM
    };
    batch.forEach(function (e) { sent.ids[e.id] = true; });
    /* Contul afla de o poza abia dupa ce fisierul ei a ajuns acolo, si doar pentru o activitate pe care o are sau o primeste acum. */
    sent.photo = photoOps(sent.ids);
    inflight = sent.ids;
    syncing = true;
    var args = {
      p_add: batch.map(function (e) {
        var o = { id: e.id, day: e.day, ts: e.ts, type: e.type, pts: e.pts, pub: !!e.pub };

        if (e.note) o.note = e.note;

    if (sent.note.length) args.p_note = sent.note;
    if (sent.photo.length) args.p_photo = sent.photo;
    if (sent.edu) args.p_kids = data.edu;
    API.rpc('sync', args).then(function (res) {
      if (late()) return;
      applySync(res, sent);
      syncErr = '';
      syncFails = 0;
      /* Ce tocmai a plecat poate schimba fluxul: se reincarca acum sau la urmatoarea deschidere. */
      if (batch.length || sent.del.length || sent.vis.length || sent.note.length || sent.photo.length) {

      /* Contul e la zi: pot pleca pozele care asteapta si se pot sterge cele ramase fara activitate.

      if (!pumpFails || !data.uploads.length) queuePump(0);

      }
      if (auth === 'in') {
        if (route === 'flux') showFeed(); else if (!typing()) render(); else offerMore();
        if (syncErr) queueSync(Math.min(300000, 15000 * Math.pow(2, Math.min(syncFails, 5))));
        else if (syncAgain || canSend()) queueSync(300);
      } else {

      }

  }

  /* O activitate a unui copil pleaca spre cont doar daca baza de date stie de copii; altfel ar ajunge pe numele adultului. */
  function canTravel(e) { return !e.kid || data.sv >= EDU_FROM; }

  function applySync(res, sent) {
    if (!res || !Array.isArray(res.entries)) throw new Error('bad_response');
    data.outbox.del = data.outbox.del.filter(function (id) { return sent.del.indexOf(id) < 0; });
    data.outbox.vis = data.outbox.vis.filter(function (op) { return sent.vis.indexOf(op) < 0; });
    data.outbox.note = data.outbox.note.filter(function (op) { return sent.note.indexOf(op) < 0; });
    data.outbox.photo = data.outbox.photo.filter(function (op) { return sent.photo.indexOf(op) < 0; });

    var stillDeleting = {}, onServer = {}, next = [], had = {};
    data.outbox.del.forEach(function (id) { stillDeleting[id] = true; });
    data.entries.forEach(function (e) { if (e.photo) had[e.photo] = true; });
    res.entries.forEach(function (s) {
      onServer[s.id] = true;
      if (stillDeleting[s.id]) return;
      var e = { id: s.id, ts: Number(s.ts), day: s.day, type: s.type, pts: s.pts, pub: !!s.pub, cheers: s.cheers || 0, sync: 0 };
      if (s.key) e.key = s.key; else e.name = s.name;
      if (typeof s.note === 'string' && s.note) e.note = s.note;
      if (typeof s.photo === 'string' && PHOTO.NAME.test(s.photo)) e.photo = s.photo;
      if (typeof s.kid === 'string' && UUID.test(s.kid)) { e.kid = s.kid; e.pub = false; }
      if (okItem(e)) next.push(e);
    });
    /* Ce s-a schimbat aici cat timp cererea era pe drum ramane valabil. */
    data.outbox.vis.forEach(function (op) {
      for (var i = 0; i < next.length; i++) if (next[i].id === op.id) next[i].pub = op.pub;
    });
    data.outbox.note.forEach(function (op) {

    data.outbox.photo.forEach(function (op) {

        if (op.photo) next[i].photo = op.photo; else delete next[i].photo;

       ramase de la o activitate stearsa acolo) nu mai au de ce sa ocupe loc. Se bazeaza pe faptul ca raspunsul aduce
       tot jurnalul; daca sync va aduce candva doar ce s-a schimbat, regula aceasta trebuie regandita. */

  /* ---------- pozele: drumul fisierelor pana in cont ---------- */

  /* Tine minte de ce a refuzat locul de poze o cerere. O legatura cazuta nu este un refuz. */
  function notePhotoErr(err) {
    if (!err || err.offline) return;
    var txt = String(err.message || '').slice(0, 160);
    if (err.status && txt.indexOf(String(err.status)) < 0) txt = err.status + ' ' + txt;
    if (txt) photoErr = txt;

  function queuePump(delay) {
    if (!BACKEND || auth !== 'in') return;
    clearTimeout(pumpTimer);
    pumpTimer = setTimeout(pump, delay == null ? 200 : delay);
  }

  function photoUsed(name) {
    for (var i = 0; i < data.entries.length; i++) if (data.entries[i].photo === name) return true;
    return false;
  }

  /* O poza care nu mai e a niciunei activitati: daca nu a apucat sa plece spre cont se arunca de pe dispozitiv, si in
     orice caz va fi stearsa si din cont dupa ce acesta afla de schimbare (putea sa ajunga acolo fara ca raspunsul sa fi
     sosit; stergerea unui fisier care nu exista nu e o eroare). */
  function releaseFile(name) {
    var i = data.uploads.indexOf(name);
    if (i >= 0 && pumping !== name) {
      data.uploads.splice(i, 1);
      PHOTO.del(name, true);

     Contul poate avea inca la activitate poza dinainte, pe care aplicatia urmeaza sa o stearga din locul de poze; de aceea
     afla si el ca activitatea nu mai are niciuna, altfel ar ramane cu trimitere la un fisier care nu mai exista. */

  /* Trimite in cont, una cate una, pozele care asteapta. Cand nu mai are ce trimite si contul e la zi,
